<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Ambient particle field</title><desc id="desc">A quiet deep-space field with soft light shafts, sparse data points, and slow neural paths.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B17"/><stop offset=".5" stop-color="#111332"/><stop offset="1" stop-color="#070B17"/></linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#66E3FF" stop-opacity=".11"/><stop offset="1" stop-color="#66E3FF" stop-opacity="0"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="dot"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="microgrid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#66E3FF" stroke-opacity=".035"/></pattern>
    <style>
      .drift{animation:drift 72s ease-in-out infinite alternate}.drift.b{animation-duration:96s;animation-delay:-28s}.twinkle{animation:twinkle 11s ease-in-out infinite alternate}.stream{stroke-dasharray:2 28;animation:flow 28s linear infinite}@keyframes drift{to{transform:translate(8px,-4px)}}@keyframes twinkle{to{opacity:.12;transform:scale(.82)}}@keyframes flow{to{stroke-dashoffset:-120}}@media(prefers-reduced-motion:reduce){.drift,.twinkle,.stream{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#wash)"/><rect width="1200" height="720" fill="url(#microgrid)"/>
  <g class="drift" fill="url(#shaft)" filter="url(#blur)"><path d="M170 0h74l150 560H280Z"/><path d="M754 0h118L748 610H638Z" fill="#8B7CFF" fill-opacity=".08"/><path d="M1034 0h56L940 520h-66Z" fill="#FFB86B" fill-opacity=".07"/></g>
  <g class="drift b" fill="none" stroke-linecap="round" opacity=".26"><path d="M40 530C200 420 302 490 434 382s232-168 382-42 226 73 340-38" stroke="#66E3FF"/><path d="M20 166C180 242 274 108 432 196s252 106 376 36 234-70 372 32" stroke="#8B7CFF"/><path d="M130 674C282 560 364 646 512 538s230-74 346 14 190 102 286 16" stroke="#FFB86B" stroke-opacity=".5"/></g>
  <g class="stream" fill="none" stroke-linecap="round" opacity=".46"><path d="M96 286 286 204 466 246" stroke="#66E3FF"/><path d="M740 440 880 378 1084 422" stroke="#8B7CFF"/><path d="M352 610 494 560 642 590" stroke="#FFB86B"/></g>
  <g fill="#F4F6FF"><circle class="twinkle" cx="72" cy="98" r="1.3"/><circle class="twinkle" cx="184" cy="248" r="1.7" fill="#66E3FF"/><circle class="twinkle" cx="300" cy="84" r="1.1"/><circle class="twinkle" cx="444" cy="276" r="1.4" fill="#8B7CFF"/><circle class="twinkle" cx="574" cy="142" r=".9"/><circle class="twinkle" cx="680" cy="360" r="1.3" fill="#66E3FF"/><circle class="twinkle" cx="820" cy="96" r="1.4"/><circle class="twinkle" cx="966" cy="236" r="1.1" fill="#FFB86B"/><circle class="twinkle" cx="1102" cy="126" r="1.5"/><circle class="twinkle" cx="1064" cy="544" r="1.1" fill="#66E3FF"/><circle class="twinkle" cx="342" cy="594" r="1.2"/><circle class="twinkle" cx="586" cy="646" r=".9" fill="#8B7CFF"/><circle class="twinkle" cx="892" cy="642" r="1.2"/></g>
  <g fill="#66E3FF" opacity=".32" filter="url(#dot)"><circle cx="252" cy="476" r="2.4"/><circle cx="730" cy="236" r="2.2"/><circle cx="1012" cy="404" r="2.2"/></g>
</svg>
