<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Sudip Bhattarai toolkit constellation</title>
  <desc id="desc">A deep-space 3D orbital map connecting Python, PyTorch, Flutter, React, Rust, Cloudflare, Transformers, and data visualization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B17"/><stop offset=".48" stop-color="#111332"/><stop offset="1" stop-color="#070B17"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#F4F6FF"/><stop offset=".18" stop-color="#66E3FF" stop-opacity=".95"/><stop offset=".6" stop-color="#8B7CFF" stop-opacity=".34"/><stop offset="1" stop-color="#66E3FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="nodeCyan"><stop stop-color="#F4F6FF"/><stop offset=".2" stop-color="#66E3FF"/><stop offset="1" stop-color="#155e88"/></radialGradient>
    <radialGradient id="nodeViolet"><stop stop-color="#F4F6FF"/><stop offset=".2" stop-color="#8B7CFF"/><stop offset="1" stop-color="#4338a8"/></radialGradient>
    <radialGradient id="nodeAmber"><stop stop-color="#FFF4E8"/><stop offset=".2" stop-color="#FFB86B"/><stop offset="1" stop-color="#9a4d2f"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="16"/></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#66E3FF" stroke-opacity=".09"/></pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 72s linear infinite}.orbit.reverse{animation-direction:reverse;animation-duration:96s}.node{transform-box:fill-box;transform-origin:center;animation:breathe 8s ease-in-out infinite alternate}.node.delay{animation-delay:-4s}.line{stroke-dasharray:4 14;animation:flow 14s linear infinite}.spark{animation:spark 6s ease-in-out infinite alternate}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{to{opacity:.78;transform:scale(1.09)}}@keyframes flow{to{stroke-dashoffset:-72}}@keyframes spark{to{opacity:.3;transform:scale(.82)}}@media(prefers-reduced-motion:reduce){.orbit,.node,.line,.spark{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="480" rx="26" fill="url(#bg)"/><rect x="20" y="20" width="1160" height="440" rx="20" fill="url(#grid)"/>
  <g opacity=".28" fill="none" stroke-linecap="round"><path d="M34 378C204 312 328 398 456 294s244-102 366-22 222 42 344-72" stroke="#66E3FF"/><path d="M20 118C194 70 322 170 474 104s260-42 392 26 220 46 314-20" stroke="#8B7CFF"/><path d="M80 430C254 360 360 442 520 356s268-20 382 20 184 26 246-16" stroke="#FFB86B" opacity=".6"/></g>
  <g transform="translate(54 54)"><text class="mono" fill="#8B7CFF" font-size="11">TOOLKIT / ORBITAL MAP</text><text y="37" class="sans" fill="#F4F6FF" font-size="28" font-weight="700">Tools are nodes. The loop is the system.</text><text y="64" class="sans" fill="#9BA9C9" font-size="14">Explore → connect → make the useful part clear.</text></g>
  <g transform="translate(606 270)">
    <ellipse rx="336" ry="116" fill="none" stroke="#66E3FF" stroke-opacity=".32" transform="rotate(-13)"/><ellipse rx="270" ry="166" fill="none" stroke="#8B7CFF" stroke-opacity=".34" transform="rotate(48)"/><ellipse rx="200" ry="80" fill="none" stroke="#FFB86B" stroke-opacity=".36" transform="rotate(-48)"/>
    <ellipse rx="126" ry="43" fill="none" stroke="#66E3FF" stroke-opacity=".18" stroke-dasharray="2 10" transform="rotate(18)"/><circle r="104" fill="url(#core)" opacity=".34" filter="url(#soft)"/><circle r="62" fill="url(#core)" opacity=".24" filter="url(#glow)"/><circle r="10" fill="#F4F6FF" filter="url(#glow)"/>
    <g class="line" fill="none" stroke-linecap="round" stroke-width="1.3"><path d="M0 0 0-160" stroke="#8B7CFF" opacity=".78"/><path d="M0 0 184-76" stroke="#FFB86B" opacity=".82"/><path d="M0 0 256 108" stroke="#66E3FF" opacity=".78"/><path d="M0 0-242 116" stroke="#8B7CFF" opacity=".74"/><path d="M0 0-312-58" stroke="#66E3FF" opacity=".72"/><path d="M0 0 94 150" stroke="#FFB86B" opacity=".72"/><path d="M0 0-144-144" stroke="#66E3FF" opacity=".72"/><path d="M0 0-22 186" stroke="#8B7CFF" opacity=".68"/></g>
    <g class="node"><circle cx="0" cy="-160" r="14" fill="#111332" stroke="#8B7CFF" stroke-opacity=".8"/><circle class="spark" cx="0" cy="-160" r="7" fill="url(#nodeViolet)" filter="url(#glow)"/><text x="22" y="-156" class="mono" fill="#F4F6FF" font-size="13">PYTORCH</text></g>
    <g class="node delay"><circle cx="184" cy="-76" r="14" fill="#111332" stroke="#FFB86B" stroke-opacity=".86"/><circle class="spark" cx="184" cy="-76" r="7" fill="url(#nodeAmber)" filter="url(#glow)"/><text x="22" y="-72" transform="translate(184)" class="mono" fill="#F4F6FF" font-size="13">FLUTTER</text></g>
    <g class="node"><circle cx="256" cy="108" r="14" fill="#111332" stroke="#66E3FF" stroke-opacity=".86"/><circle class="spark" cx="256" cy="108" r="7" fill="url(#nodeCyan)" filter="url(#glow)"/><text x="22" y="112" transform="translate(256)" class="mono" fill="#F4F6FF" font-size="13">REACT</text></g>
    <g class="node delay"><circle cx="-242" cy="116" r="14" fill="#111332" stroke="#8B7CFF" stroke-opacity=".86"/><circle class="spark" cx="-242" cy="116" r="7" fill="url(#nodeViolet)" filter="url(#glow)"/><text x="-332" y="121" class="mono" fill="#F4F6FF" font-size="13">RUST</text></g>
    <g class="node"><circle cx="-312" cy="-58" r="14" fill="#111332" stroke="#66E3FF" stroke-opacity=".86"/><circle class="spark" cx="-312" cy="-58" r="7" fill="url(#nodeCyan)" filter="url(#glow)"/><text x="-424" y="-53" class="mono" fill="#F4F6FF" font-size="13">PYTHON</text></g>
    <g class="node delay"><circle cx="94" cy="150" r="14" fill="#111332" stroke="#FFB86B" stroke-opacity=".86"/><circle class="spark" cx="94" cy="150" r="7" fill="url(#nodeAmber)" filter="url(#glow)"/><text x="116" y="155" class="mono" fill="#F4F6FF" font-size="13">CLOUDFLARE</text></g>
    <g class="node"><circle cx="-144" cy="-144" r="14" fill="#111332" stroke="#66E3FF" stroke-opacity=".86"/><circle class="spark" cx="-144" cy="-144" r="7" fill="url(#nodeCyan)" filter="url(#glow)"/><text x="-276" y="-139" class="mono" fill="#F4F6FF" font-size="13">TRANSFORMERS</text></g>
    <g class="node delay"><circle cx="-22" cy="186" r="13" fill="#111332" stroke="#8B7CFF" stroke-opacity=".86"/><circle class="spark" cx="-22" cy="186" r="6" fill="url(#nodeViolet)" filter="url(#glow)"/><text x="-132" y="215" class="mono" fill="#F4F6FF" font-size="12">DATA VIZ</text></g>
    <text x="-46" y="-7" class="mono" fill="#F4F6FF" font-size="10">OPEN LOOP</text><text x="-40" y="12" class="mono" fill="#9BA9C9" font-size="9">LEARN / TEST</text>
  </g>
  <g class="mono" font-size="10" fill="#71809E"><text x="54" y="430">SUDIP / CAPABILITY SIGNALS</text><text x="1002" y="430" fill="#66E3FF">08 NODES</text></g>
</svg>
