<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Sudip Bhattarai — Research, Build, Share</title>
  <desc id="desc">A cyber-research lab banner with a floating layered cube, orbital rings, data streams, and the words Research Build Share.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B17"/><stop offset=".52" stop-color="#111332"/><stop offset="1" stop-color="#070B17"/></linearGradient>
    <radialGradient id="halo" cx="72%" cy="43%" r="50%"><stop stop-color="#66E3FF" stop-opacity=".24"/><stop offset=".44" stop-color="#8B7CFF" stop-opacity=".11"/><stop offset="1" stop-color="#070B17" stop-opacity="0"/></radialGradient>
    <linearGradient id="cyanFace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66E3FF" stop-opacity=".9"/><stop offset="1" stop-color="#28739d" stop-opacity=".44"/></linearGradient>
    <linearGradient id="violetFace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8B7CFF" stop-opacity=".9"/><stop offset="1" stop-color="#3d357f" stop-opacity=".5"/></linearGradient>
    <linearGradient id="goldFace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFB86B" stop-opacity=".95"/><stop offset="1" stop-color="#a85839" stop-opacity=".55"/></linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#66E3FF" stroke-opacity=".1"/></pattern>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#66E3FF" stop-opacity="0"/><stop offset=".42" stop-color="#66E3FF" stop-opacity=".75"/><stop offset="1" stop-color="#FFB86B" stop-opacity="0"/></linearGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em}.title{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-weight:760;letter-spacing:.08em}.sub{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-weight:500;letter-spacing:.02em}.small{font-size:10px}.stream{stroke-dasharray:9 17;animation:flow 18s linear infinite}.orbit{transform-origin:850px 184px;animation:spin 72s linear infinite}.orbit.slow{animation-duration:96s;animation-direction:reverse}.float{animation:float 12s ease-in-out infinite alternate}.twinkle{animation:twinkle 8s ease-in-out infinite alternate}@keyframes flow{to{stroke-dashoffset:-104}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{to{transform:translateY(-3px) rotate(.25deg)}}@keyframes twinkle{to{opacity:.42;transform:scale(.78)}}@media(prefers-reduced-motion:reduce){.stream,.orbit,.float,.twinkle{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#halo)"/>
  <rect x="18" y="18" width="1164" height="324" rx="18" fill="url(#grid)" opacity=".55"/>
  <g opacity=".48" stroke="#8B7CFF" stroke-width="1" fill="none"><path d="M34 286C210 250 300 298 454 266S690 188 842 228s226 30 324-10"/><path d="M14 82C188 110 280 74 418 108s210 10 332-34 268-4 426 38"/></g>
  <g opacity=".22" fill="#fff"><circle cx="77" cy="62" r="1.5"/><circle cx="146" cy="301" r="1"/><circle cx="1100" cy="72" r="1.2"/><circle cx="1060" cy="306" r="1.7"/><circle cx="956" cy="42" r=".9"/><circle cx="480" cy="42" r="1.1"/></g>
  <g class="twinkle" fill="#66E3FF" filter="url(#glowCyan)"><circle cx="718" cy="82" r="2"/><circle cx="1066" cy="194" r="2.2"/><circle cx="944" cy="304" r="1.8"/></g>
  <g fill="none" stroke-linecap="round"><path class="stream" d="M580 94C692 104 734 122 830 170S1014 234 1134 220" stroke="url(#stream)" stroke-width="2"/><path class="stream" d="M614 295C726 264 746 224 838 198s158-26 284-66" stroke="url(#stream)" stroke-width="1.5" style="animation-delay:-2s"/><path class="stream" d="M676 36C728 86 782 102 832 164s84 84 182 116" stroke="#8B7CFF" stroke-opacity=".5" stroke-width="1" style="animation-delay:-4s"/></g>
  <g class="orbit" fill="none" stroke-linecap="round"><ellipse cx="850" cy="184" rx="245" ry="76" stroke="#66E3FF" stroke-opacity=".6"/><ellipse cx="850" cy="184" rx="206" ry="112" transform="rotate(63 850 184)" stroke="#8B7CFF" stroke-opacity=".58"/><ellipse cx="850" cy="184" rx="150" ry="52" transform="rotate(-28 850 184)" stroke="#FFB86B" stroke-opacity=".56"/></g>
  <g class="orbit slow" fill="#66E3FF" filter="url(#glowCyan)"><circle cx="1094" cy="184" r="4"/><circle cx="646" cy="184" r="3"/><circle cx="850" cy="75" r="3.4" fill="#FFB86B"/></g>
  <ellipse cx="850" cy="294" rx="184" ry="25" fill="#66E3FF" opacity=".12" filter="url(#shadow)"/>
  <g class="float" transform="translate(850 178) rotate(-8)">
    <g opacity=".24" filter="url(#glowSoft)"><path d="M0-86 92-37 0 16-92-37Z" fill="#66E3FF"/><path d="M0-86 92-37v104L0 120Z" fill="#8B7CFF"/><path d="M0-86-92-37v104L0 120Z" fill="#FFB86B"/></g>
    <g stroke="#d9fbff" stroke-opacity=".76" stroke-width="1.2"><path d="M0-92 100-40 0 15-100-40Z" fill="url(#cyanFace)"/><path d="M0-92 100-40v105L0 120Z" fill="url(#violetFace)"/><path d="M0-92-100-40v105L0 120Z" fill="url(#goldFace)"/></g>
    <g fill="none" stroke="#fff" stroke-opacity=".34" stroke-width="1"><path d="M-50-55 0-30 50-55"/><path d="M0-30v105"/><path d="M-62-23 0 10 62-23"/><path d="M-32-72v26M32-72v26M-62-23v28M62-23v28"/></g>
    <circle cy="-30" r="5" fill="#fff" opacity=".85" filter="url(#glowCyan)"/>
  </g>
  <g transform="translate(62 64)">
    <text class="mono small" fill="#66E3FF">RESEARCH <tspan fill="#8B7CFF">•</tspan> BUILD <tspan fill="#8B7CFF">•</tspan> SHARE</text>
    <text y="64" class="title" fill="#F6F8FF" font-size="43">SUDIP BHATTARAI</text>
    <text y="94" class="sub" fill="#c8d1ea" font-size="17">Generative AI · Full-stack · Open Source</text>
    <g transform="translate(0 132)"><rect width="238" height="32" rx="16" fill="#0b1630" stroke="#66E3FF" stroke-opacity=".62"/><circle cx="18" cy="16" r="4" fill="#66E3FF" filter="url(#glowCyan)"/><text x="31" y="20" class="mono" font-size="11" fill="#d9fbff">&gt; turning curiosity into code_</text></g>
  </g>
  <text x="62" y="319" class="mono" font-size="10" fill="#71809e">FIELD NOTE / 001 · SUNSARI, NEPAL · SYSTEMS ONLINE</text>
  <g class="mono small" fill="#8B7CFF"><text x="1042" y="324">01</text><text x="1110" y="324" fill="#FFB86B">LAB</text></g>
</svg>
