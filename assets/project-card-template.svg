<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Cyber-research project card template</title>
  <desc id="desc">A reusable glass project card with neon edges, floating glyph space, a status pill, and metadata hierarchy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B17"/><stop offset=".55" stop-color="#111332"/><stop offset="1" stop-color="#070B17"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#243b62" stop-opacity=".7"/><stop offset="1" stop-color="#0c1129" stop-opacity=".84"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66E3FF"/><stop offset=".55" stop-color="#8B7CFF"/><stop offset="1" stop-color="#FFB86B"/></linearGradient>
    <radialGradient id="glow" cx="75%" cy="25%"><stop stop-color="#66E3FF" stop-opacity=".42"/><stop offset="1" stop-color="#66E3FF" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#000814" flood-opacity=".6"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#66E3FF" stroke-opacity=".1"/></pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.float{animation:float 5.5s ease-in-out infinite alternate}.pulse{animation:pulse 3s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-7px) rotate(2deg)}}@keyframes pulse{to{opacity:.36;transform:scale(1.14)}}@media(prefers-reduced-motion:reduce){.float,.pulse{animation:none}}
    </style>
  </defs>
  <rect width="640" height="420" rx="28" fill="url(#bg)"/><rect x="22" y="22" width="596" height="376" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-opacity=".6" filter="url(#shadow)"/><rect x="36" y="36" width="568" height="348" rx="16" fill="url(#grid)" opacity=".5"/><path d="M38 150h564" stroke="#66E3FF" stroke-opacity=".16"/><circle cx="440" cy="76" r="86" fill="url(#glow)" filter="url(#soft)"/>
  <g class="mono" font-size="11"><text x="58" y="74" fill="#66E3FF">PROJECT SIGNAL / 00</text><rect x="500" y="54" width="78" height="25" rx="12.5" fill="#071c2c" stroke="#66E3FF" stroke-opacity=".6"/><circle class="pulse" cx="515" cy="66.5" r="4" fill="#66E3FF"/><text x="526" y="70" fill="#D9FBFF" font-size="9">LIVE</text></g>
  <g class="float" transform="translate(500 108)"><path d="M0 18 43-7l43 25-43 25Z" fill="#66E3FF" opacity=".9" stroke="#F4F6FF" stroke-opacity=".5"/><path d="M0 18v50l43 25V43Z" fill="#FFB86B" opacity=".72" stroke="#fff" stroke-opacity=".35"/><path d="M86 18v50l-43 25V43Z" fill="#8B7CFF" opacity=".82" stroke="#fff" stroke-opacity=".35"/><circle cx="43" cy="43" r="12" fill="#F4F6FF" opacity=".82"/></g>
  <g class="sans"><text x="58" y="198" fill="#9BA9C9" font-size="11" letter-spacing="3">INTERFACE / SYSTEMS</text><text x="58" y="246" fill="#F4F6FF" font-size="30" font-weight="700">Project title</text><text x="58" y="276" fill="#9BA9C9" font-size="14">A concise proof of a useful idea,</text><text x="58" y="297" fill="#9BA9C9" font-size="14">with the status kept honest.</text></g>
  <g class="mono" font-size="10"><rect x="58" y="329" width="62" height="24" rx="7" fill="#111332" stroke="#66E3FF" stroke-opacity=".32"/><text x="70" y="345" fill="#9BA9C9">REACT</text><rect x="130" y="329" width="78" height="24" rx="7" fill="#111332" stroke="#8B7CFF" stroke-opacity=".32"/><text x="142" y="345" fill="#9BA9C9">PYTHON</text><text x="488" y="345" fill="#66E3FF">VIEW DETAILS ↗</text></g>
</svg>
