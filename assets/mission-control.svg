<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mission control: build, learn, share</title>
  <desc id="desc">A neon isometric console with three orbiting signals representing build, learn, and share.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B1B"/>
      <stop offset="0.48" stop-color="#101A3A"/>
      <stop offset="1" stop-color="#211442"/>
    </linearGradient>
    <linearGradient id="cyanPanel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#075985" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="violetPanel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#4C1D95" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="amberPanel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBBF73" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#B45309" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="glowCyan" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#67E8F9" stroke-opacity="0.1"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { letter-spacing: 0.18em; }
      .orbit { transform-box: fill-box; transform-origin: center; animation: orbit 14s linear infinite; }
      .orbit.reverse { animation-direction: reverse; animation-duration: 18s; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
      .blink { animation: blink 2.3s steps(2, end) infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes blink { 0%,72%,100% { opacity: 1; } 74%,92% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .orbit, .pulse, .blink { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <path d="M0 318C240 265 420 380 620 320C840 255 1010 310 1200 238" stroke="#67E8F9" stroke-opacity="0.12"/>
  <path d="M0 350C260 302 430 410 660 344C880 280 1050 330 1200 274" stroke="#A78BFA" stroke-opacity="0.12"/>

  <g class="mono">
    <text x="66" y="74" fill="#67E8F9" font-size="13" font-weight="700" class="label">MISSION CONTROL / 03</text>
    <text x="66" y="121" fill="#F7F8FF" font-size="39" font-weight="800">SELECT YOUR NEXT BUILD</text>
    <text x="66" y="151" fill="#A6ACC7" font-size="16">A README-native interaction layer for curious builders.</text>
    <rect x="66" y="186" width="254" height="42" rx="10" fill="#67E8F9" fill-opacity="0.1" stroke="#67E8F9" stroke-opacity="0.55"/>
    <text x="86" y="212" fill="#B7F5FF" font-size="12" font-weight="700" class="label blink">STATUS: READY TO EXPLORE</text>

    <g opacity="0.9">
      <rect x="66" y="285" width="126" height="48" rx="12" fill="#0B122B" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="86" y="306" fill="#FBBF73" font-size="11" font-weight="700" class="label">01 / BUILD</text>
      <text x="86" y="322" fill="#A6ACC7" font-size="11">ship a prototype</text>
      <rect x="208" y="285" width="126" height="48" rx="12" fill="#0B122B" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="228" y="306" fill="#67E8F9" font-size="11" font-weight="700" class="label">02 / LEARN</text>
      <text x="228" y="322" fill="#A6ACC7" font-size="11">follow the signal</text>
      <rect x="350" y="285" width="126" height="48" rx="12" fill="#0B122B" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="370" y="306" fill="#A78BFA" font-size="11" font-weight="700" class="label">03 / SHARE</text>
      <text x="370" y="322" fill="#A6ACC7" font-size="11">open the loop</text>
    </g>
  </g>

  <g transform="translate(818 226)" filter="url(#shadow)">
    <path d="M-150 -88L0 -172L150 -88L0 -4L-150 -88Z" fill="url(#amberPanel)" stroke="#FDE68A" stroke-opacity="0.55"/>
    <path d="M-150 -88V84L0 168V-4L-150 -88Z" fill="url(#cyanPanel)" stroke="#A5F3FC" stroke-opacity="0.5"/>
    <path d="M150 -88V84L0 168V-4L150 -88Z" fill="url(#violetPanel)" stroke="#DDD6FE" stroke-opacity="0.5"/>
    <path d="M-90 -55L0 -105L90 -55L0 -5L-90 -55Z" fill="#111827" fill-opacity="0.38" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <path d="M-90 -55V48L0 98V-5L-90 -55Z" fill="#0E7490" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <path d="M90 -55V48L0 98V-5L90 -55Z" fill="#6D28D9" fill-opacity="0.34" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="-31" y="-52" fill="#FFF7ED" font-size="12" font-weight="800" class="mono label">CORE</text>
    <text x="-57" y="68" fill="#ECFEFF" font-size="12" font-weight="800" class="mono label">SIGNAL</text>
    <text x="18" y="66" fill="#F5F3FF" font-size="12" font-weight="800" class="mono label">LOOP</text>

    <g class="orbit" opacity="0.82">
      <ellipse cx="0" cy="-3" rx="218" ry="74" stroke="#67E8F9" stroke-opacity="0.62"/>
      <circle class="pulse" cx="218" cy="-3" r="7" fill="#67E8F9" filter="url(#glowCyan)"/>
    </g>
    <g class="orbit reverse" opacity="0.7">
      <ellipse cx="0" cy="-3" rx="208" ry="66" transform="rotate(58)" stroke="#FBBF73" stroke-opacity="0.58"/>
      <circle class="pulse" cx="0" cy="-211" r="7" fill="#FBBF73" filter="url(#glowCyan)"/>
    </g>
    <g class="orbit" opacity="0.66">
      <ellipse cx="0" cy="-3" rx="218" ry="70" transform="rotate(-58)" stroke="#A78BFA" stroke-opacity="0.58"/>
      <circle class="pulse" cx="0" cy="-215" r="7" fill="#A78BFA" filter="url(#glowCyan)"/>
    </g>
  </g>

  <g class="mono">
    <text x="956" y="78" fill="#A6ACC7" font-size="11" class="label">BUILD / LEARN / SHARE</text>
    <text x="956" y="102" fill="#F7F8FF" font-size="14" font-weight="700">ONLINE</text>
    <circle cx="939" cy="97" r="5" fill="#67E8F9" filter="url(#glowCyan)"/>
  </g>
</svg>
