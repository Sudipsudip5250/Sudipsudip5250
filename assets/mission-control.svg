<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Mission control console</title><desc id="desc">A holographic research console with three pathways: Build, Learn, and Share.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D1C"/><stop offset=".55" stop-color="#16153B"/><stop offset="1" stop-color="#080D1C"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17234A" stop-opacity=".94"/><stop offset="1" stop-color="#0A1025" stop-opacity=".97"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66E3FF"/><stop offset="1" stop-color="#2e91dd"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8B7CFF"/><stop offset="1" stop-color="#5d3db3"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFB86B"/><stop offset="1" stop-color="#d66c43"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="15"/></filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#66E3FF" stroke-opacity=".11"/></pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.label{font-weight:760;letter-spacing:.12em}.scan{animation:scan 18s ease-in-out infinite}.pulse{animation:pulse 7s ease-in-out infinite alternate}.flow{stroke-dasharray:5 15;animation:flow 13s linear infinite}.float{animation:float 14s ease-in-out infinite alternate}.hover{transition:filter .2s ease,opacity .2s ease}.hover:hover{filter:url(#glow);opacity:1}@keyframes scan{0%,100%{transform:translateY(-92px);opacity:0}45%,55%{opacity:.44}50%{transform:translateY(92px)}}@keyframes pulse{to{opacity:.54;transform:scale(1.07)}}@keyframes flow{to{stroke-dashoffset:-100}}@keyframes float{to{transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){.scan,.pulse,.flow,.float{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="440" rx="26" fill="url(#bg)"/><rect x="20" y="20" width="1160" height="400" rx="20" fill="url(#grid)"/>
  <g opacity=".25" fill="none" stroke-linecap="round"><path d="M0 342C188 286 312 356 430 289s186-90 310-19 232 41 460-68" stroke="#66E3FF"/><path d="M0 378C204 322 340 396 514 329s266-30 390 10 194 18 296-29" stroke="#8B7CFF"/><path class="scan" d="M80 120h1040" stroke="#66E3FF" stroke-opacity=".9"/></g>
  <g transform="translate(52 44)"><text class="mono" fill="#66E3FF" font-size="11">MISSION CONTROL / ACTIVE ROUTES</text><text class="sans" y="38" fill="#F4F6FF" font-size="28" font-weight="700">Choose the next useful signal.</text><text class="sans" y="66" fill="#9BA9C9" font-size="14">Three paths, one open learning loop.</text><rect y="88" width="238" height="30" rx="15" fill="#0b1630" stroke="#66E3FF" stroke-opacity=".58"/><circle cx="17" cy="103" r="4" fill="#66E3FF" filter="url(#glow)"/><text x="31" y="107" class="mono" fill="#d9fbff" font-size="10">STATUS: READY TO EXPLORE</text></g>
  <g transform="translate(48 194)">
    <g class="hover float" opacity=".96"><path d="M0 36 62 0h254l62 36-62 36H62Z" fill="url(#panel)" stroke="#66E3FF" stroke-opacity=".78"/><path d="M18 36 70 8h238l50 28-50 28H70Z" fill="none" stroke="#66E3FF" stroke-opacity=".16"/><circle cx="31" cy="36" r="9" fill="#66E3FF" opacity=".18"/><circle class="pulse" cx="31" cy="36" r="4" fill="#66E3FF" filter="url(#glow)"/><text x="57" y="29" class="mono" fill="#66E3FF" font-size="9">01 / PATHWAY</text><text x="57" y="53" class="sans label" fill="#F4F6FF" font-size="21">BUILD</text><text x="180" y="42" class="mono" fill="#8FA4C8" font-size="9">prototype → test</text></g>
    <g class="hover float" transform="translate(0 79)" opacity=".96" style="animation-delay:-2s"><path d="M0 36 62 0h254l62 36-62 36H62Z" fill="url(#panel)" stroke="#8B7CFF" stroke-opacity=".8"/><path d="M18 36 70 8h238l50 28-50 28H70Z" fill="none" stroke="#8B7CFF" stroke-opacity=".18"/><circle cx="31" cy="36" r="9" fill="#8B7CFF" opacity=".18"/><circle class="pulse" cx="31" cy="36" r="4" fill="#8B7CFF" filter="url(#glow)"/><text x="57" y="29" class="mono" fill="#8B7CFF" font-size="9">02 / PATHWAY</text><text x="57" y="53" class="sans label" fill="#F4F6FF" font-size="21">LEARN</text><text x="180" y="42" class="mono" fill="#8FA4C8" font-size="9">trace → explain</text></g>
    <g class="hover float" transform="translate(0 158)" opacity=".96" style="animation-delay:-4s"><path d="M0 36 62 0h254l62 36-62 36H62Z" fill="url(#panel)" stroke="#FFB86B" stroke-opacity=".84"/><path d="M18 36 70 8h238l50 28-50 28H70Z" fill="none" stroke="#FFB86B" stroke-opacity=".18"/><circle cx="31" cy="36" r="9" fill="#FFB86B" opacity=".18"/><circle class="pulse" cx="31" cy="36" r="4" fill="#FFB86B" filter="url(#glow)"/><text x="57" y="29" class="mono" fill="#FFB86B" font-size="9">03 / PATHWAY</text><text x="57" y="53" class="sans label" fill="#F4F6FF" font-size="21">SHARE</text><text x="180" y="42" class="mono" fill="#8FA4C8" font-size="9">document → open</text></g>
  </g>
  <g transform="translate(520 130)"><rect width="620" height="245" rx="18" fill="#080E20" stroke="#66E3FF" stroke-opacity=".48"/><rect x="14" y="14" width="592" height="217" rx="13" fill="none" stroke="#8B7CFF" stroke-opacity=".25"/><path d="M18 52h584" stroke="#66E3FF" stroke-opacity=".14"/><text x="28" y="38" class="mono" fill="#8FA4C8" font-size="10">LIVE TELEMETRY</text><text x="490" y="38" class="mono" fill="#66E3FF" font-size="10">NODE 03</text>
    <g fill="none" stroke-linecap="round"><path class="flow" d="M35 82C120 46 176 112 257 78s126 21 216-8 85 4 110 7" stroke="#66E3FF" stroke-width="2"/><path class="flow" d="M35 130C112 104 170 164 244 125s136 28 250-20 77-7 98-8" stroke="#8B7CFF" stroke-opacity=".86" stroke-width="2" style="animation-delay:-1.7s"/><path class="flow" d="M35 178C118 160 178 198 260 168s168 3 248-20 84 2 99-7" stroke="#FFB86B" stroke-opacity=".78" stroke-width="2" style="animation-delay:-3.1s"/></g>
    <g fill="#F4F6FF" opacity=".9"><circle cx="98" cy="72" r="3"/><circle cx="278" cy="80" r="3" fill="#66E3FF"/><circle cx="438" cy="111" r="3" fill="#8B7CFF"/><circle cx="214" cy="160" r="3" fill="#FFB86B"/><circle cx="506" cy="153" r="3" fill="#66E3FF"/></g><g class="mono" font-size="9" fill="#71809E"><text x="28" y="216">curiosity</text><text x="190" y="216">evidence</text><text x="350" y="216">utility</text><text x="510" y="216">open loop</text></g>
  </g>
  <g class="mono" font-size="10" fill="#71809E"><text x="54" y="414">SUDIP / RESEARCH LAB</text><text x="1000" y="414" fill="#66E3FF">STATUS: ONLINE</text></g>
</svg>
